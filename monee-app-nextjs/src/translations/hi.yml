  reviews:
    - title: "शानदार ऐप!!"
      body: "घरेलू हिसाब‑किताब रखना बेहद उपयोगी होता है और Monee के साथ यह वाकई आसान हो गया है! लेआउट साफ़, इंटरफ़ेस सहज और इस्तेमाल में आसान है, ज़रूरी सभी फ़ंक्शंस मौजूद हैं और आय‑व्यय का विश्लेषण भी है। अब किसी और ऐप की ज़रूरत नहीं… और यह सब पूरी तरह मुफ़्त व बिना विज्ञापन। डेवलपर को सलाम और बहुत‑बहुत धन्यवाद!!!"
      reviewerNickname: "Jürgen A."
      createdDate: "02/11/2025"
    - title: "कमाल की स्पष्टता और खूबसूरत डिज़ाइन!"
      body: "मैंने छह साल तक दूसरी ऐप से खर्च दर्ज किए और कुछ हफ्ते पहले इस पर स्विच किया: यह ज़्यादा सुंदर, हल्की, आधुनिक और बहुत आसान है। और आज के अपडेट में डेवलपर ने सोलो इस्तेमाल की मेरी इच्छा भी पूरी कर दी। ❤️ मैं बेहद खुश हूँ! 🙏🏻🤩 ऐप बेहतरीन है और डेवलपर सवालों का जवाब बहुत जल्दी देते हैं। टॉप!"
      reviewerNickname: "Lukulli"
      createdDate: "02/11/2025"
    - title: "खर्च और आय ट्रैक करने के लिए परफेक्ट ऐप"
      body: "हम यह ऐप एक साल से अधिक समय से इस्तेमाल कर रहे हैं और बहुत संतुष्ट हैं। ऐप मुफ़्त है, अक्सर अपडेट मिलता है और नए फ़ीचर आते रहते हैं। आप रिकरिंग खर्च/आय ऑटोमेट कर सकते हैं, कैटेगरी जोड़ सकते हैं और बाद में सबकुछ फ़िल्टर करके देख सकते हैं कि किस कैटेगरी में कितना गया। मेहनत साफ़ दिखती है!"
      reviewerNickname: "User31.12."
      createdDate: "03/10/2025"
    - title: "वाकई बढ़िया ऐप! सच में बहुत पसंद आया!"
      body: "सच में: ऐप वह सब देता है जिसकी ज़रूरत है, बनावट शानदार है और जिन छोटी‑मोटी चीज़ों को मैं अलग करता, वे किसी भी तरह स्टार घटाने लायक नहीं। कोई कीमत नहीं, कोई साइन‑अप, MFA या और परेशानियाँ नहीं। सच में बढ़िया ऐप! बहुत पसंद आया! THANK YOU! 🙏🏻"
      reviewerNickname: "VNZNTG"
      createdDate: "08/02/2024"
    - title: "पेड ऐप्स से बेहतर"
      body: "ईमानदारी से कहूँ तो यह फर्स्ट‑क्लास ऐप है। और यह कि यह पूरी तरह मुफ़्त और बिना विज्ञापन है—सिर्फ़ शाबाशी से बढ़कर सराहना का हक़दार है। 🙂"
      reviewerNickname: "TimeForIOTA"
      createdDate: "01/09/2025"
    - title: "Monee — रोज़मर्रा के लिए टॉप फाइनेंस ऐप!"
      body: "मैं Monee कुछ समय से इस्तेमाल कर रहा हूँ और बिल्कुल प्रसन्न हूँ! ऐप सहज, व्यवस्थित और पैसों पर नज़र रखना बेहद आसान बनाता है। मुझे खासकर साफ़ कैटेगरी लेआउट, ऑटो‑सिंक और उपयोगी विश्लेषण पसंद हैं। Monee की बदौलत बिना जटिल शीट्स या थकाऊ कैलकुलेशन के आय‑व्यय पर हमेशा नियंत्रण रहता है। भरोसेमंद, आधुनिक ऐप चाहिए—तो यही है। स्पष्ट सिफारिश!"
      reviewerNickname: "DG#4"
      createdDate: "03/08/2025"
    - title: "कभी किसी ऐप को लेकर इतना उत्साहित नहीं हुआ"
      body: "ऐसी मुफ़्त ऐप्स कम मिलती हैं जो सच में काम की हों—वो भी बिना विज्ञापन। लेआउट साफ़ और देखने में सुखद है, इस्तेमाल आसान। पब्लिशर को धन्यवाद!"
      reviewerNickname: "StSch."
      createdDate: "12/02/2024"
    - title: "क्लियर और सिंपल"
      body: "इस ऐप से प्यार है। कई ऐप्स आज़माईं, कोई जंची नहीं—या तो महँगी, या भरी‑भरी, या बेवजह फ़ीचर्स। यह ऐप सुंदर संरचना, स्पष्टता और सादगी के साथ—वो भी मुफ़्त और बिना अनावश्यक सजावट। ऐसे ही जारी रखें, THANK YOU!"
      reviewerNickname: "Tammiilein"
      createdDate: "03/15/2025"
    - title: "परफेक्ट हाउसहोल्ड बजट ऐप"
      body: "आख़िरकार एक ऐसा ऐप जिसमें फालतू सजावट नहीं और ज़रूरी सबकुछ मौजूद! बच्चों जैसा आसान संचालन, अलग‑अलग रिद्म में रिकरिंग पेमेंट्स, आसानी से संभलने वाली कैटेगरी, और ऐसे विश्लेषण जो स्थिति साफ़ दिखाएँ—और यह सब मुफ़्त <3 बहुत‑बहुत धन्यवाद! :-)"
      reviewerNickname: "Plueschappel"
      createdDate: "03/21/2025"
    - title: "बेस्ट ऐप!!"
      body: "कई ऐप्स आज़माईं और यह सबसे बढ़िया निकली! पूरी तरह मुफ़्त और बिना विज्ञापन… मुझे लगा था कोई न कोई पेंच होगा… पर नहीं है। इस्तेमाल में आसान और अपनी ज़रूरतों के मुताबिक ढालना भी—क्योंकि हर चीज़ के लिए कस्टम कैटेगरी बना सकते हैं। इससे बेहतर क्या!"
      reviewerNickname: "Kadania"
      createdDate: "03/07/2025"
    - title: "जो चाहिए—सबकुछ!"
      body: "नए फ़ंक्शंस ‘एक साथ सभी फ़िल्टर क्लियर करें’ और ‘एकल खर्च को खास व्यक्ति से जोड़ें’ के साथ अब ऐप में सबकुछ है! बिना दिखावे के, स्लीक और मूल बातों पर केंद्रित—ग़ज़ब! और सुपर‑फ़ास्ट, बेहद फ्रेंडली सपोर्ट को न भूलें! काश हर चीज़ के लिए ऐसी बढ़िया, निस्वार्थ ऐप्स मिलें—ज़िंदगी आसान हो जाए। डेवलपर को बहुत‑बहुत धन्यवाद!!!"
      reviewerNickname: "Gahndalf"
      createdDate: "07/24/2024"
    - title: "कमाल—बहुत मददगार, शुक्रिया"
      body: "क्लियर; कैटेगरी पर्याप्त हैं, और चाहें तो और जोड़/एडिट कर सकते हैं, विश्लेषण के लिए ग्राफ़िक ओवरव्यू और नोट्स के लिए पर्याप्त जगह भी है। नतीजा: बिना सजावट वाला बढ़िया ऐप जो तुरंत खर्च दर्ज कराने, मनी‑ट्रैप्स दिखाने और बाद में कैटेगराइज़ करने में मदद करता है। धन्यवाद!"
      reviewerNickname: "Matt1210er"
      createdDate: "07/15/2024"
    - title: "ब्रिलियंट"
      body: "अगर आप खर्च दर्ज करने का आसान टूल चाहते हैं—या शेयर हाउस/पार्टनरशिप में रहते हैं—तो यह ऐप कमाल है। हर कोई अपनी खरीदी हुई चीज़ दर्ज करता और कैटेगराइज़ कर सकता है। बाद में मासिक/वार्षिक विश्लेषण भी कर सकते हैं। मैं प्रभावित हूँ और इस पूरी तरह मुफ़्त व बिना विज्ञापन ऐप की सिफारिश करता हूँ। डेवलपर को धन्यवाद 🙏🏼"
      reviewerNickname: "Casu65"
      createdDate: "07/29/2024"
    - title: "ग्रेट ऐप!"
      body: "मैं UI डिज़ाइनर हूँ और परिवार के साथ इस्तेमाल करने के लिए बहुत मिनिमल कुछ ढूँढ रहा था—बूम! सटीक निशाना। इतनी बढ़िया लुक के लिए डेवलपर को सलाम। हम दोनों बहुत खुश हैं: ऐप बिना दिखावे के काम करता है, वित्त का अच्छा ओवरव्यू देता है—वो भी मुफ़्त। हैम्बर्ग से हैम्बर्ग को सलाम, प्रिय Stephan :)."
      reviewerNickname: "Pueppsiliiiii"
      createdDate: "07/31/2024"
    - title: "ग्रेट ऐप और तेज़ सर्विस"
      body: "हाउसहोल्ड लेज़र के लिए मुझे जिन फ़ंक्शंस की ज़रूरत है, वे ऐप में हैं। सेटअप में एक दिक्कत आई तो डेवलपर ने फ़ीडबैक फ़ंक्शन से तुरंत मदद की। ऐसा अनुभव पहली बार—5*!"
      reviewerNickname: "Proxy365er"
      createdDate: "10/23/2024"
    - title: "क्लियर और सीधे‑सीधे"
      body: "Monee पैसों पर नज़र रखने के लिए परफेक्ट है—वो भी जल्दी और आसानी से—बिना विज्ञापन, बिना सब्सक्रिप्शन और बिना अनावश्यक बोझ के। क्लियर प्रस्तुति, सहज संचालन और आय‑व्यय पर पूरा नियंत्रण। बिल्कुल अनुशंसित!"
      reviewerNickname: "DonMonk"
      createdDate: "08/11/2024"
    - title: "जो करना चाहिए—वही करता है!"
      body: "आख़िरकार एक मुफ़्त, बिना सजावट वाला ऐप जो वित्त पर नज़र रखना आसान बना देता है! शानदार! आपके काम के लिए शुक्रिया! 👍🏼"
      reviewerNickname: "Famcramer"
      createdDate: "03/12/2025"
    - title: "बहुत क्लियर और मददगार"
      body: "मैंने 2025 की शुरुआत में ऐप डाउनलोड किया और इससे बहुत संतुष्ट हूँ। कैटेगरी कस्टमाइज़ करना और आय‑व्यय दर्ज करना क्लियर है, और जो चार्ट बनते हैं वे दिलचस्प हैं। ऐप इस्तेमाल करना अच्छा लगता है।"
      reviewerNickname: "JayBeeBerlin"
      createdDate: "03/08/2025"
    - title: "वादा पूरा करता है"
      body: "मैं कुछ समय से Monee इस्तेमाल कर रहा हूँ और बहुत संतुष्ट हूँ। यह सरल और क्लियर है, फिर भी ज़रूरी सबकुछ देता है। ज़रूर आज़माएँ!"
      reviewerNickname: "Schnicki_Tim"
      createdDate: "03/09/2025"
    - title: "सरल लेआउट और संचालन"
      body: "लंबे समय तक उपयुक्त फाइनेंस ऐप ढूँढता रहा और यही ठीक निकला! बस खर्च और आय—कोई अकाउंट लिंकिंग या टोटल‑वेल्थ ट्रैकिंग नहीं। हर महीने साफ़ दिखता है कि कितना खर्च/कमाया। यही चाहिए था: बिना सजावट वाला सिंपल ऐप!"
      reviewerNickname: "Kathi H. ☺️"
      createdDate: "11/08/2024"
    - title: "मॉडर्न, सरल, अच्छा, मुफ़्त"
      body: "मैं बहुत खुश हूँ। ऐसी ऐप्स अब दुर्लभ हैं, इसलिए और भी क़ीमती—यह वही करती है जो करना चाहिए, उससे ज़्यादा नहीं। दिखने में अच्छी, उपयोग में शानदार, कोई डेटा कलेक्शन नहीं, कुछ बेचने की कोशिश नहीं। ज्ञान और मोटिवेशन से बनी—किसी संदिग्ध कंपनी की नहीं।"
      reviewerNickname: "mageful"
      createdDate: "04/26/2025"
    - title: "क्लियर—पर विकल्पों के साथ"
      body: "मैं रेनोवेशन और नई खरीदों को दिन‑प्रतिदिन के खर्चों से अलग ट्रैक करने का सिंपल तरीका ढूँढ रहा था। कई प्रयासों के बाद Monee पहला मुफ़्त और क्लियर प्रोग्राम मिला। ग़लत कैटेगराइज़्ड एंट्री बाद में बदल/डिलीट कर सकता हूँ—यह मेरे लिए बहुत अहम था। अभी एक हफ्ते से इस्तेमाल कर रहा हूँ और उम्मीद है सब ऐसा ही रहे।"
      reviewerNickname: "Charly221122"
      createdDate: "04/23/2025"
    - title: "बेहतरीन ऐप"
      body: "पहले मैं एक और ऐप इस्तेमाल करता था जो बहुत ओवरलोडेड और इसलिए उलझाऊ था। यह ऐप बिना सजावट के काम चला लेता है, सेल्फ‑एक्सप्लेनटरी है और सालाना पेमेंट अपने‑आप प्ररेट हो जाते हैं—तुरंत पता चलता है कि हर महीने कितना अलग रखना है। मैं उत्साहित हूँ 🙂"
      reviewerNickname: "M.B.19935"
      createdDate: "07/15/2024"
    - title: "बहुत यूज़र‑फ्रेंडली"
      body: "मैं अपने खर्चों को सटीक ट्रैक/कैटेगराइज़ करने का आसान तरीका ढूँढ रहा था। यह ऐप मेरी ज़रूरत पूरी करता है—बहुत आसान, जल्दी समझ आने वाला, बिना अनावश्यक सजावट, और खूबसूरती से बिना विज्ञापन/खर्च के। तीन महीने में एक भी आउटेज नहीं—डेवलपर को सलाम।"
      reviewerNickname: "Privatuser14"
