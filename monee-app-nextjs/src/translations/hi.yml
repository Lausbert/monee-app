authors:
  stephan_lerner:
    bio: "मैं सर्वोत्तम मनी मैनेजमेंट ऐप विकसित कर रहा हूँ।"
  lina:
    bio: "बर्लिन की संचार की छात्रा, जो वास्तविक आँकड़े और बिना-झंझट बजटिंग प्रयोग साझा करती है जो सच में छात्र जीवन पर फिट बैठते हैं।"
  maya_and_tom:
    bio: "हैम्बर्ग का जोड़ा, जो दिखाता है कि वे किराना, बिल और यात्रा को कैसे निष्पक्ष तरीके से बाँटते हैं—ऐसे सरल नियमों के साथ जिन्हें कोई भी अपना सकता है।"
  jules:
    bio: "कोलोन के फ़्रीलांस डिज़ाइनर, जो अनियमित आय में बजट बनाना व्यावहारिक टेम्पलेट्स, श्रेणी प्रणालियों और मासिक सार के ज़रिए आसान बनाते हैं।"
  elena:
    bio: "म्यूनिख की माँ और परिवार की CFO, जो छिपे हुए ख़र्चे ढूँढती हैं और 15-मिनट का सौम्य साप्ताहिक मनी चेक-इन चलाती हैं।"
  marco:
    bio: "फ्रैंकफ़र्ट से आए, लिस्बन में रहने वाले प्रवासी, जो मल्टी-करेंसी ट्रैवल बजट, शहर-दर-शहर खर्च गाइड और कैरिओवर/शेष-राशि-आगे-ले-जाने के टिप्स साझा करते हैं।"
  nadia:
    bio: "बातचीत प्रशिक्षक, जो तनावपूर्ण पैसों वाली कॉल्स को सरल और सम्मानजनक स्क्रिप्ट में बदलती हैं ताकि आप बिल घटा सकें और फीस आत्मविश्वास से रद्द कर सकें।"
  rafael:
    bio: "निष्पक्ष प्रोडक्ट समीक्षक, जो बैंक, बीमा ऐड-ऑन और फिनटेक को पोर्टेबिलिटी, पारदर्शिता और वास्तविक एग्ज़िट योजनाओं के लिए स्ट्रेस-टेस्ट करता है।"
  ashia:
    bio: "व्यवहार कोच, जो कोमल, बिना शर्म के प्रोत्साहन और छोटी डिफ़ॉल्ट सेटिंग्स डिज़ाइन करती हैं, ताकि असली लोग अपने मनी इरादों को पूरा कर सकें।"
  bao:
    bio: "गणित-न्यूनतम समझाने वाला, जो धन संबंधी विकल्पों को यादगार नियमों, स्पष्ट सीमाओं और सरल विज़ुअल्स में बदलता है जिन्हें आप सच में उपयोग कर सकते हैं।"
  zoe:
    bio: "सीनारियो प्लानर, जो मूल्य-आधारित निर्णय मैट्रिक्स के साथ मार्गदर्शन करती हैं ताकि आप जीवन और धन के विकल्प स्पष्टता और आत्मविश्वास से चुन सकें।"
