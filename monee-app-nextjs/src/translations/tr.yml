authors:
  stephan_lerner:
    bio: "En iyi para yönetimi uygulamasını geliştiriyorum."
  lina:
    bio: "Berlin'de iletişim öğrencisiyim; gerçek rakamlar ve öğrencilik hayatına uyan pratik bütçe denemeleri paylaşıyorum."
  maya_and_tom:
    bio: "Hamburglu bir çiftiz; market, fatura ve seyahat giderlerini adilce nasıl paylaştığımızı ve herkesin uygulayabileceği basit kuralları anlatıyoruz."
  jules:
    bio: "Köln'de serbest çalışan bir tasarımcıyım; düzensiz gelirlere sahip olanlar için şablonlar, kategori sistemleri ve aylık özetlerle bütçe yönetimini sadeleştiriyorum."
  elena:
    bio: "Münihli bir anneyim ve ev finans direktörüyüm; kaçak maliyetleri yakalarım ve nazik bir 15 dakikalık haftalık para kontrolü yaparım."
  marco:
    bio: "Frankfurt'tan çıkıp Lizbon'a yerleşmiş bir expat; çoklu para birimli seyahat bütçeleri, şehir bazlı harcama rehberleri ve bakiye taşıma tüyoları paylaşıyorum."
  nadia:
    bio: "Müzakere koçu olarak para konuşmalarındaki stresi saygılı senaryolara çeviriyorum; faturaları düşürüp ücretleri güvenle iptal etmene yardım ediyorum."
  rafael:
    bio: "Tarafsız bir ürün inceleyicisiyim; bankaları, sigorta eklentilerini ve fintech'i taşınabilirlik, şeffaflık ve gerçek çıkış planları için stres testine sokuyorum."
  ashia:
    bio: "Davranış koçu olarak nazik, utançsız itici güçler ve küçük varsayılan ayarlar tasarlıyor; gerçek insanların para niyetlerini sürdürmesine destek oluyorum."
  bao:
    bio: "Matematiği minimumda tutan bir anlatıcıyım; para seçimlerini akılda kalıcı prensiplere, net eşiklere ve gerçekten kullanabileceğin basit görsellere indiriyorum."
  zoe:
    bio: "Senaryo planlayıcısıyım; değer odaklı karar matrisleriyle yaşam ve para seçenekleri arasında net ve güvenle seçim yapmana rehberlik ediyorum."
