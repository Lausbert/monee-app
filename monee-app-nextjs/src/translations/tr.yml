  reviews:
    - title: "Harika uygulama!!"
      body: "Bir ev bütçesi defterinin ne kadar faydalı olduğu bir yana, geliştiricinin Monee ile büyük bir başarı elde ettiğini düşünüyorum! Arayüz çok net, sezgisel ve kullanımı kolay. Tüm temel özellikler mevcut ve elbette gelir-gider analizi de var. Başka bir uygulamaya ihtiyacım kalmadı—üstelik tamamen ücretsiz ve reklamsız. Geliştiriciye saygı ve çok teşekkürler!"
      reviewerNickname: "Jürgen A."
      createdDate: "02/11/2025"
    - title: "Son derece net ve çok şık tasarım!"
      body: "Altı yıl boyunca başka bir uygulamayla giderlerimi kaydettim ve birkaç hafta önce Monee'ye geçtim: Çok daha şık, hafif, modern ve kullanması çok daha kolay. Bugünkü güncellemede, uygulamayı tek başıma kullanabilme isteğimi bile gerçekleştirdi. Tam anlamıyla bayıldım! Uygulama harika ve geliştirici sorulara çok hızlı yanıt veriyor. Harika!"
      reviewerNickname: "Lukulli"
      createdDate: "02/11/2025"
    - title: "Gider ve gelir takibi için kusursuz"
      body: "Uygulamayı bir yıldan uzun süredir kullanıyoruz ve çok memnunuz. Ücretsiz, sık sık güncelleniyor ve yeni özellikler ekleniyor. Tekrarlayan giderleri ve gelirleri otomatikleştirebilir, kategoriler ekleyebilir ve daha sonra tam olarak hangi kategoride ne kadar harcadığını görebilirsin. Verilen emeği net biçimde görüyorsun!"
      reviewerNickname: "User31.12."
      createdDate: "03/10/2025"
    - title: "Gerçekten çok iyi! Bayıldım!"
      body: "Ciddi söylüyorum: Uygulama ihtiyacın olan her şeyi sunuyor, gayet sağlam yapılmış ve benim farklı yapacağım ufak şeyler bir yıldızı hak etmiyor. Ücretsiz, kayıt yok, MFA yok, can sıkıcı hiçbir şey yok. Harika uygulama! Bayıldım! TEŞEKKÜRLER!"
      reviewerNickname: "VNZNTG"
      createdDate: "08/02/2024"
    - title: "Ücretli uygulamalardan daha iyi"
      body: "Gerçekten birinci sınıf bir uygulama. Tamamen ücretsiz ve reklamsız olması yalnızca nazik bir alkışı değil, çok daha fazlasını hak ediyor."
      reviewerNickname: "TimeForIOTA"
      createdDate: "01/09/2025"
    - title: "Monee – Günlük kullanım için mükemmel!"
      body: "Uzun zamandır Monee kullanıyorum ve kesinlikle çok mutluyum! Uygulama sezgisel, düzenli ve finanslarımı takip etmeyi inanılmaz derecede kolaylaştırıyor. Kategori düzeninin netliğini, otomatik senkronizasyonu ve yararlı analizleri çok seviyorum. Monee sayesinde gelir ve giderlerim her zaman kontrol altında—karmaşık tablolar veya yorucu hesaplamalar olmadan. Güvenilir, modern bir finans uygulaması arıyorsan tam burada. Kesinlikle öneririm!"
      reviewerNickname: "DG#4"
      createdDate: "03/08/2025"
    - title: "Bir uygulamaya bu kadar nadir heyecanlandım"
      body: "Gerçekten işe yarayan ve üstelik reklamsız olan ücretsiz bir uygulama bulmak zor. Arayüz net ve göze hoş geliyor, kullanımı çok kolay. Yayıncıya teşekkürler!"
      reviewerNickname: "StSch."
      createdDate: "12/02/2024"
    - title: "Net ve basit"
      body: "Bu uygulamayı seviyorum. Birçok uygulamayı denedim ama hiçbiri beni ikna etmedi—ya çok pahalı, ya karmakarışık ya da gereğinden fazla özellikliydi. Monee ise güzelce düzenlenmiş, sade ve gereksiz süslerden uzak. Böyle devam edin, TEŞEKKÜR EDERİM!"
      reviewerNickname: "Tammiilein"
      createdDate: "03/15/2025"
    - title: "Mükemmel ev bütçesi uygulaması"
      body: "Nihayet gereksiz süsler olmadan ama ihtiyaç duyduğun her şeyi sağlayan bir uygulama! Kullanımı çocuk oyuncağı, farklı aralıklarla tekrarlayan ödemeler ekleyebilirsin, kategorileri kolayca yönetebilirsin, analizler ne olup bittiğini açıkça gösteriyor—üstelik hepsi ücretsiz. Çok teşekkürler!"
      reviewerNickname: "Plueschappel"
      createdDate: "03/21/2025"
    - title: "En iyi uygulama!!"
      body: "Pek çok uygulama denedim ve bu kesinlikle en iyisi! Tamamen ücretsiz ve reklamsız… Bir yerde bir hile bekliyordum ama yok. Kullanımı kolay ve her şeye özel kategoriler oluşturabildiğin için ihtiyaçlarına göre uyarlayabiliyorsun. Daha iyisi yok!!"
      reviewerNickname: "Kadania"
      createdDate: "03/07/2025"
    - title: "İhtiyacın olan her şey!"
      body: "‘Tüm filtreleri bir kerede temizle’ ve ‘tekil giderleri kişilere ata’ gibi yeni özelliklerle uygulamanın artık ihtiyacım olan her şeye sahip olduğunu düşünüyorum! Sade, hafif ve tam odaklı—harika! Ayrıca süper hızlı ve çok ilgili destek ekiplerini unutmamak lazım! Keşke her şey için böyle harika, karşılıksız uygulamalar bulabilsek. Geliştiriciye çok teşekkürler!!!"
      reviewerNickname: "Gahndalf"
      createdDate: "07/24/2024"
    - title: "Harika, teşekkürler – büyük bir yardım"
      body: "Net; yeterince kategori var, daha fazlasını ekleyip düzenlemek mümkün. Analizler için grafik görünüm ve notlar için geniş bir alan da var. Sonuç: Süslemeden uzak ama masrafları hemen kaydetmene, para tuzaklarını görmene ve sonrasında kategorize etmene yardımcı olan harika bir uygulama. Teşekkürler!"
      reviewerNickname: "Matt1210er"
      createdDate: "07/15/2024"
    - title: "Mükemmel"
      body: "Giderlerini kaydetmek için basit bir araç arayanlar ve/veya aynı evi paylaşanlar için müthiş bir uygulama. Herkes aldığı şeyleri girebilir ve kategorize edebilir. Sonrasında aylık ya da yıllık analizler yapabilirsin. Tamamen ücretsiz ve reklamsız bu uygulamayı içtenlikle tavsiye ediyorum. Geliştiriciye teşekkürler!"
      reviewerNickname: "Casu65"
      createdDate: "07/29/2024"
    - title: "Harika uygulama!"
      body: "Bir UI tasarımcısıyım ve ailece kullanabileceğimiz minimal bir şey arıyorduk—işte tam isabet! Geliştiriciyi hem işlevsellik hem de harika görünüm için tebrik ederim. Eşimle birlikte çok memnunuz: Uygulama gereksiz karmaşa olmadan finansımıza iyi bir genel bakış sunuyor ve bunların hepsi ücretsiz. Sevgili Stephan, Hamburg'dan Hamburg'a selamlar :)."
      reviewerNickname: "Pueppsiliiiii"
      createdDate: "07/31/2024"
    - title: "Hızlı destekle harika uygulama"
      body: "Uygulama, bir ev bütçesi defteri için ihtiyaç duyduğum tüm işlevleri sunuyor. Kurulum sırasında bir sorun yaşadığımda geliştirici geri bildirim özelliği üzerinden anında yardımcı oldu. Böyle bir şeyi daha önce görmemiştim—5 yıldız!"
      reviewerNickname: "Proxy365er"
      createdDate: "10/23/2024"
    - title: "Net ve anlaşılır"
      body: "Monee, finansını hızlı ve kolay bir şekilde takip etmek isteyenler için mükemmel bir uygulama—reklam yok, abonelik yok, gereksiz yük yok. Net sunum, sezgisel kullanım ve gelir-gider üzerinde tam kontrol. Kesinlikle öneriyorum!"
      reviewerNickname: "DonMonk"
      createdDate: "08/11/2024"
    - title: "Görevini yapıyor!"
      body: "Nihayet gereksiz süslerden uzak, finansını kolayca takip etmeni sağlayan ücretsiz bir uygulama! Harika! Emeğiniz için teşekkürler!"
      reviewerNickname: "Famcramer"
      createdDate: "03/12/2025"
    - title: "Çok net ve faydalı"
      body: "Uygulamayı 2025'in başında indirdim ve çok memnunum. Kategorileri özelleştirmek ve gelir-gider girişi yapmak anlaşılır, oluşturulan grafikler ise oldukça ilgi çekici. Uygulamayı kullanmayı seviyorum."
      reviewerNickname: "JayBeeBerlin"
      createdDate: "03/08/2025"
    - title: "Söz verdiğini yerine getiriyor"
      body: "Bir süredir Monee kullanıyorum ve çok memnunum. Basit ve net ama ihtiyaç duyduğun her şey var. Şiddetle tavsiye ederim!"
      reviewerNickname: "Schnicki_Tim"
      createdDate: "03/09/2025"
    - title: "Basit arayüz ve kullanım"
      body: "Uygun bir finans uygulamasını uzun süre aradım ve sonunda buldum! Sadece gider ve gelir—hesap bağlantısı veya toplam varlık takibi yok. Her ay ne kadar harcadığımı ve kazandığımı net biçimde görebiliyorum. Tam olarak istediğim şey: süssüz, basit bir uygulama!"
      reviewerNickname: "Kathi H."
      createdDate: "11/08/2024"
    - title: "Modern, sade, iyi ve ücretsiz"
      body: "Çok etkilendim. Böyle uygulamalar artık pek kalmadı, bu yüzden daha da değerli: Ne yapması gerekiyorsa onu yapıyor—fazlası yok. Güzel görünüyor, çok kullanışlı, veri toplamıyor ve ekstra bir şey satmaya çalışmıyor. Bilgili ve motive bir kişi tarafından geliştirilmiş, şüpheli bir şirketten değil."
      reviewerNickname: "mageful"
      createdDate: "04/26/2025"
    - title: "Birçok seçenekle net"
      body: "Günlük harcamalar dışında tadilat ve yeni alışverişlerimizi tek bakışta takip edecek basit bir sistem arıyordum. Birkaç başarısız denemeden sonra Monee, karşıma çıkan ilk ücretsiz ve net program oldu. Yanlış kategorilendirdiğim kayıtları sonradan değiştirebilmem veya silebilmem benim için çok önemliydi. Henüz bir haftadır kullanıyorum ve her şeyin böyle devam etmesini umuyorum."
      reviewerNickname: "Charly221122"
      createdDate: "04/23/2025"
    - title: "Harika uygulama"
      body: "Daha önce aşırı karmaşık ve bu yüzden anlaşılması zor bir uygulama kullanıyordum. Monee gereksiz süslerden uzak, kendi kendini anlatıyor ve yıllık ödemeleri otomatik olarak aylara dağıtıyor; böylece her ay ne kadar bir kenara koymam gerektiğini hemen görüyorum. Çok memnun kaldım!"
      reviewerNickname: "M.B.19935"
      createdDate: "07/15/2024"
    - title: "Kullanıcı dostu"
      body: "Harcama ve gelirlerimi doğru şekilde takip edip kategorize etmenin basit bir yolunu arıyordum. Bu uygulama ihtiyaçlarımı karşılıyor, kullanımı çok kolay, çabucak öğreniliyor, gereksiz süslerden arınmış ve harika şekilde reklam ya da gizli masraf içermiyor. Uygulamayı bulduğum için çok mutluyum ve geliştiriciye teşekkür ederim. Üç ay boyunca tek bir kesinti olmadan çalışması da ayrı bir takdir konusu."
      reviewerNickname: "Privatuser14"
      createdDate: "03/08/2025"
