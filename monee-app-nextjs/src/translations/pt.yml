  play_store_badge_alt: "Em breve no Google Play"
  award:
    title: "🥳 O Monee ganhou o Prémio TheAppNote.com \"Melhor Aplicação de Controlo de Orçamento e Despesas 2025\""
    link: "https://www.theappnote.com/award/best-budget-expense-tracker-app-2025"
  app_ratings:
    stars: "⭐️⭐️⭐️⭐️⭐️"
    score: "Classificação Global: 4.9 / 5.0"
    count: "Baseado em mais de 7000 Classificações e Avaliações"
    downloads: "Mais de 100.000 downloads mundialmente"
  reviews:
    - title: "Excelente aplicação!!"
      body: "Além do facto de um livro de contas domésticas ser uma coisa super útil e importante, acho que o desenvolvedor conseguiu um verdadeiro sucesso com o Monee! É claro, intuitivo e fácil de usar, todas as funções essenciais estão incluídas e obviamente há uma análise de receitas e despesas. Já não preciso de outra aplicação... e tudo isto é completamente gratuito e sem anúncios. Respeito e muito obrigado ao desenvolvedor!!!"
      reviewerNickname: "Jürgen A."
      createdDate: "11/02/2025"
    - title: "Brilhantemente claro e lindamente desenhado!"
      body: "Usei outra aplicação para registar as minhas despesas durante seis anos e mudei para esta há algumas semanas: é muito mais bonita, mais leve, mais moderna e muito mais fácil de usar. E na atualização de hoje o desenvolvedor até cumpriu o meu desejo de poder usar a aplicação sozinho. ❤️ Estou absolutamente emocionado! 🙏🏻🤩 A aplicação é fantástica e o desenvolvedor responde muito rapidamente às perguntas. Top!"
      reviewerNickname: "Lukulli"
      createdDate: "11/02/2025"
    - title: "Aplicação perfeita para controlar despesas e receitas"
      body: "Temos usado a aplicação há mais de um ano e estamos muito satisfeitos. A aplicação é gratuita, é atualizada frequentemente e novas funcionalidades são adicionadas constantemente. Pode automatizar despesas ou receitas recorrentes, adicionar categorias e depois filtrar tudo para saber exatamente quanto gastou em qualquer categoria específica. Pode-se mesmo ver o esforço por trás!"
      reviewerNickname: "User31.12."
      createdDate: "10/03/2025"
    - title: "Aplicação muito boa! Cara, gosto muito!"
      body: "Seriamente: a aplicação oferece tudo o que precisa, é bem feita e qualquer coisa que eu pessoalmente faria diferente não vale a pena deduzir uma estrela. Não custa nada, sem registo, MFA ou outras coisas irritantes. Aplicação muito boa! Cara, gosto muito! OBRIGADO! 🙏🏻"
      reviewerNickname: "VNZNTG"
      createdDate: "02/08/2024"
    - title: "Melhor que aplicações pagas"
      body: "Realmente tem que se dizer que esta é uma aplicação de primeira classe. E o facto de ser completamente gratuita e sem anúncios merece mais que apenas uma reverência cortês. 🙂"
      reviewerNickname: "TimeForIOTA"
      createdDate: "09/01/2025"
    - title: "Monee - Aplicação financeira top para uso diário!"
      body: "Tenho usado o Monee há algum tempo e estou absolutamente encantado! A aplicação é intuitiva, bem organizada e torna incrivelmente fácil acompanhar as minhas finanças. Gosto especialmente do layout claro das categorias, sincronização automática e análises úteis. Graças ao Monee tenho sempre as minhas receitas e despesas sob controlo—sem planilhas complicadas ou cálculos tediosos. Se está à procura de uma aplicação financeira confiável e moderna, esta é a indicada. Recomendação clara!"
      reviewerNickname: "DG#4"
      createdDate: "08/03/2025"
    - title: "Raramente fiquei tão empolgado com uma aplicação"
      body: "É raro encontrar aplicações gratuitas que realmente façam algo—quanto mais sem anúncios. Acho o layout claro e agradável de ver, e é fácil de usar. Obrigado ao editor!"
      reviewerNickname: "StSch."
      createdDate: "02/12/2024"
    - title: "Clara e simples"
      body: "Adoro esta aplicação. Tentei muitas e nenhuma me convenceu—demasiado caras, demasiado confusas, demasiadas funções. Esta é lindamente estruturada e clara, mas simples e gratuita sem adornos desnecessários. Continue assim, OBRIGADO!"
      reviewerNickname: "Tammiilein"
      createdDate: "15/03/2025"
    - title: "Aplicação de orçamento doméstico perfeita"
      body: "Finalmente uma aplicação que se mantém sem muitos adornos mas ainda assim entrega tudo o que precisa! Operação fácil como criança, pagamentos recorrentes em diferentes ritmos, categorias fáceis de manter, análises que mostram claramente o que está a acontecer—e tudo gratuito <3 Muito obrigado! :-)"
      reviewerNickname: "Plueschappel"
      createdDate: "21/03/2025"
    - title: "Melhor aplicação!!"
      body: "Tentei várias aplicações e esta é definitivamente a melhor! Completamente gratuita e sem anúncios... Na verdade estava à espera de um truque... mas não há nenhum. Fácil de usar e adaptar às suas próprias necessidades porque pode criar categorias personalizadas para tudo. Não fica melhor!!"
      reviewerNickname: "Kadania"
      createdDate: "07/03/2025"
    - title: "Tudo o que precisa!"
      body: "Com as novas funções \"limpar todos os filtros de uma vez\" e \"atribuir despesas individuais a pessoas específicas\", a aplicação agora tem tudo o que precisa! Sem adornos, bonita e magra, focada no essencial—ótimo! Sem esquecer o suporte super rápido e muito amigável! Se apenas houvesse aplicações tão fantásticas e altruístas para tudo, as nossas vidas seriam mais fáceis. Muito obrigado ao desenvolvedor!!!"
      reviewerNickname: "Gahndalf"
      createdDate: "24/07/2024"
    - title: "Incrível, obrigado - uma grande ajuda"
      body: "Claro; categorias suficientes, mas pode adicionar mais e editá-las, mais uma visão gráfica para análise e muito espaço no campo de comentários para notas adicionais. Conclusão: uma aplicação fantástica sem adornos que imediatamente ajuda a registar custos, visualizar armadilhas de dinheiro e depois categorizá-las. Obrigado!"
      reviewerNickname: "Matt1210er"
      createdDate: "15/07/2024"
    - title: "Brilhante"
      body: "Uma aplicação brilhante se está à procura de uma ferramenta simples para registar as suas despesas e/ou se vive numa habitação partilhada ou parceria. Todos podem inserir e categorizar o que compraram. Depois pode analisar custos mensalmente ou anualmente. Estou impressionado e posso recomendar esta aplicação completamente gratuita e sem anúncios. Obrigado 🙏🏼 ao desenvolvedor!"
      reviewerNickname: "Casu65"
      createdDate: "29/07/2024"
    - title: "Aplicação fantástica!"
      body: "Sou designer de UI e estava à procura de algo muito minimalista que pudéssemos usar como família—bam! Alvo certo. Parabéns ao desenvolvedor por torná-la tão bonita também. O meu marido e eu estamos muito felizes: a aplicação consegue funcionar sem confusão e dá-nos uma boa visão geral das nossas finanças, e tudo isso gratuito. Saudações de Hamburgo para Hamburgo, caro Stephan :)."
      reviewerNickname: "Pueppsiliiiii"
      createdDate: "31/07/2024"
    - title: "Aplicação fantástica com serviço rápido"
      body: "A aplicação em si oferece todas as funções que preciso para um livro de contas domésticas. Quando tive um problema durante a configuração, o desenvolvedor ajudou-me imediatamente através da função de feedback. Nunca experienciei algo assim—5*!"
      reviewerNickname: "Proxy365er"
      createdDate: "23/10/2024"
    - title: "Clara e direta"
      body: "O Monee é a aplicação perfeita para acompanhar as suas finanças rápida e facilmente—sem anúncios, subscrições ou bagagem desnecessária. Apresentação clara, operação intuitiva e controlo total sobre receitas e despesas. Absolutamente recomendado!"
      reviewerNickname: "DonMonk"
      createdDate: "11/08/2024"
    - title: "Faz o que deve fazer!"
      body: "Finalmente uma aplicação gratuita sem adornos que permite acompanhar as suas finanças facilmente! Fantástico! Obrigado pelo seu trabalho! 👍🏼"
      reviewerNickname: "Famcramer"
      createdDate: "12/03/2025"
    - title: "Muito clara e útil"
      body: "Descarreguei a aplicação no início de 2025 e estou muito satisfeito com ela. Personalizar categorias e inserir receitas e despesas é claro, e os gráficos gerados são interessantes. Adoro usar a aplicação."
      reviewerNickname: "JayBeeBerlin"
      createdDate: "08/03/2025"
    - title: "Entrega o que promete"
      body: "Tenho usado o Monee há algum tempo e estou muito satisfeito. É simples e claro mas tem tudo o que precisa. Altamente recomendado!"
      reviewerNickname: "Schnicki_Tim"
      createdDate: "09/03/2025"
    - title: "Layout e operação simples"
      body: "Procurei uma aplicação financeira adequada durante muito tempo e esta é! Apenas despesas e receitas—sem ligação de contas ou rastreamento de riqueza total. Cada mês posso ver exatamente quanto gastei e ganhei. Exatamente o que queria: uma aplicação simples sem adornos!"
      reviewerNickname: "Kathi H. ☺️"
      createdDate: "08/11/2024"
    - title: "Moderna, simples, boa, gratuita"
      body: "Estou emocionado. Aplicações como esta tornaram-se raras, o que a torna ainda mais valiosa: faz o que deve fazer—nada mais. Tem boa aparência, muito utilizável, não recolhe dados e não tenta vender nada extra. Criada por alguém com conhecimento e motivação, não por uma empresa duvidosa do estrangeiro."
      reviewerNickname: "mageful"
      createdDate: "26/04/2025"
    - title: "Clara com muitas opções"
      body: "Estava à procura de um sistema simples para rastrear o nosso trabalho de renovação e novas compras de relance sem despesas do dia a dia. Após várias tentativas falhadas, o Monee foi o primeiro programa gratuito e claro. Posso reatribuir ou eliminar itens mal categorizados depois, o que foi muito importante para mim. Só tenho usado há uma semana e espero que tudo permaneça como está."
      reviewerNickname: "Charly221122"
      createdDate: "23/04/2025"
    - title: "Aplicação fantástica"
      body: "Anteriormente usei outra aplicação que estava demasiado sobrecarregada e portanto confusa. Esta aplicação consegue funcionar sem muitos adornos, é autoexplicativa e pagamentos anuais são automaticamente proporcionalizados, então sei imediatamente quanto preciso de reservar cada mês. Estou entusiasmado 🙂"
      reviewerNickname: "M.B.19935"
      createdDate: "15/07/2024"
    - title: "Muito amigável ao utilizador"
      body: "Estava à procura de uma forma simples de monitorizar e categorizar as minhas despesas com precisão. Esta aplicação atende às minhas necessidades, é muito fácil de usar, rápida de entender, livre de adornos desnecessários e maravilhosamente sem anúncios e sem custo. Estou extremamente feliz por ter encontrado esta aplicação e agradeço ao desenvolvedor. Respeito pelo facto de que em três meses de uso não houve uma única falha."
      reviewerNickname: "Privatuser14"
      createdDate: "08/03/2025"
  features:
    - title: "Entrada Rápida e Fácil"
      description: "Insira o valor, escolha uma categoria e opcionalmente adicione uma nota — feito em segundos!"
      emoji: "✍️"
    - title: "Visão Geral Perspicaz"
      description: "Veja exatamente para onde vai o seu dinheiro com resumos mensais das suas receitas e despesas."
      emoji: "📊"
    - title: "Lar Partilhado"
      description: "Convide outros e gira facilmente finanças partilhadas — perfeito para famílias ou colegas de casa."
      emoji: "🏠"
    - title: "Contas Ilimitadas"
      description: "Crie tantas contas separadas quantas precisar — para diferentes pessoas, objetivos ou projetos."
      emoji: "➕"
    - title: "Transações Ilimitadas"
      description: "Adicione tantas entradas de receitas e despesas quanto quiser. Sem limites."
      emoji: "💸"
    - title: "Transações Recorrentes"
      description: "Acompanhe automaticamente receitas ou despesas repetitivas com facilidade."
      emoji: "🔁"
    - title: "Categorias Personalizadas"
      description: "Organize as suas finanças à sua maneira com categorias que define."
      emoji: "🗂️"
    - title: "Filtros Poderosos"
      description: "Encontre exatamente o que procura filtrando transações por tipo, frequência ou pessoas envolvidas."
      emoji: "🔍"
    - title: "Moedas Mundiais"
      description: "Use qualquer moeda que quiser — perfeito para viajantes ou utilizadores internacionais."
      emoji: "🌍"
    - title: "Exportar Dados"
      description: "Exporte os seus dados financeiros sempre que precisar."
      emoji: "📤"
    - title: "Perfeito Entre Dispositivos"
      description: "Use o Monee no seu iPhone, iPad e Mac — com os seus dados sincronizados suavemente entre todos os dispositivos."
      emoji: "🧩"
    - title: "Proteção Biométrica e por Código"
      description: "Mantenha os seus dados seguros com Face ID, Touch ID ou um código de acesso."
      emoji: "🔐"
    - title: "Início de Mês Flexível"
      description: "Defina o início do seu mês financeiro para qualquer dia que preferir."
      emoji: "📅"
    - title: "Transferência de Saldo"
      description: "Transfira o seu saldo restante para o próximo mês com facilidade."
      emoji: "🔄"
    - title: "Sem Registo"
      description: "Comece imediatamente — sem inscrição, sem complicações."
      emoji: "🚪"
    - title: "Sem Anúncios, Sem Rastreamento"
      description: "Desfrute de uma experiência limpa e privada sem anúncios e sem rastreamento de dados."
      emoji: "🛡️"
    - title: "100% Gratuito"
      description: "Todas as funcionalidades incluídas sem custo — sem subscrições, sem compras na aplicação."
      emoji: "🎉"

