    bio: "Casal de Hamburgo documentando como dividem de forma justa as compras, as contas e as viagens — com regras simples que qualquer pessoa pode copiar."
  jules:
    bio: "Designer freelancer em Colônia que descomplica o orçamento com renda irregular usando modelos práticos, sistemas de categorias e resumos mensais."
  elena:
    bio: "Mãe de Munique e CFO da família que caça gastos ocultos e conduz um check-in financeiro semanal leve de 15 minutos."
  marco:
    bio: "Expat em Lisboa, de Frankfurt, que compartilha orçamentos de viagem em múltiplas moedas, guias de gastos cidade a cidade e truques de carryover (reaproveitamento de saldo)."
  nadia:
    bio: "Coach de negociação que transforma ligações estressantes sobre dinheiro em roteiros respeitosos para reduzir contas e cancelar taxas com confiança."
  rafael:
    bio: "Revisor imparcial que desmonta bancos, complementos de seguros e fintechs para testá-los quanto à portabilidade, transparência e planos de saída reais."
  ashia:
    bio: "Coach comportamental que desenha incentivos gentis, sem vergonha, e pequenos padrões automáticos que ajudam pessoas reais a cumprir suas intenções financeiras."
  bao:
    bio: "Explicador minimalista em matemática que destila escolhas financeiras em regras fáceis de lembrar, limites claros e visuais simples que você realmente pode usar."
  zoe:
    bio: "Planejadora de cenários que te orienta com matrizes de decisão guiadas por valores para escolher opções de vida e dinheiro com clareza e confiança."
