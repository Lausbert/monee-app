  app_name: "Monee — учёт бюджета и расходов"
  app_description: "Monee помогает вам снова взять под контроль свои финансы."
  app_keywords: "приложение бюджет, учёт расходов, управление деньгами, личные финансы, финансовое планирование, трекер сбережений, финансовые цели"
  app_screenshot: "assets/screenshot_en.webp"
  iphone_preview_alt: "Предпросмотр приложения Monee на iPhone"
  ios_app_country: "ru"
  app_store_badge_alt: "Загрузить в App Store"
  play_store_badge_alt: "Скоро в Google Play"
  award:
    title: "🥳 Monee получил награду TheAppNote.com \"Лучшее приложение для бюджета и учёта расходов 2025\""
    link: "https://www.theappnote.com/award/best-budget-expense-tracker-app-2025"
  app_ratings:
    stars: "⭐️⭐️⭐️⭐️⭐️"
    score: "Глобальная оценка: 4.9 / 5.0"
    count: "Более 10 000 оценок и отзывов"
    downloads: "200 000+ загрузок по всему миру"
  reviews:
    - title: "Отличное приложение!!"
      body: "Домашняя бухгалтерия — вещь суперполезная, а с Monee разработчик сделал настоящий прорыв! Всё наглядно, интуитивно и удобно, все важные функции на месте и, конечно, есть анализ доходов и расходов. Другие приложения больше не нужны… и всё это полностью бесплатно и без рекламы. Респект и огромное спасибо разработчику!!!"
      reviewerNickname: "Jürgen A."
      createdDate: "02/11/2025"
    - title: "Блестяще понятно и красиво оформлено!"
      body: "Шесть лет записывала расходы в другом приложении и пару недель назад перешла на это: оно симпатичнее, легче, современнее и намного проще в использовании. А в сегодняшнем обновлении разработчик исполнил моё желание — использовать приложение соло. ❤️ Я в полном восторге! 🙏🏻🤩 Приложение отличное, разработчик очень быстро отвечает. Топ!"
      reviewerNickname: "Lukulli"
      createdDate: "02/11/2025"
    - title: "Идеально для учёта доходов и расходов"
      body: "Пользуемся приложением уже больше года и очень довольны. Бесплатно, часто обновляется, постоянно добавляются новые функции. Можно автоматизировать регулярные расходы/доходы, добавлять категории и потом всё фильтровать — точно знаете, сколько ушло в каждой категории. Видно, сколько труда вложено!"
      reviewerNickname: "User31.12."
      createdDate: "03/10/2025"
    - title: "Действительно классное приложение! Очень нравится!"
      body: "Серьёзно: приложение даёт всё, что нужно, сделано качественно, а те мелочи, которые я бы сделал иначе, вообще не повод снимать звёзды. Ничего не стоит, без регистрации, MFA и прочей нервотрёпки. Реально классное приложение! Очень нравится! СПАСИБО! 🙏🏻"
      reviewerNickname: "VNZNTG"
      createdDate: "08/02/2024"
    - title: "Лучше платных приложений"
      body: "Честно говоря, это приложение первого класса. И тот факт, что оно полностью бесплатно и без рекламы, достоин большего, чем просто вежливый реверанс. 🙂"
      reviewerNickname: "TimeForIOTA"
      createdDate: "01/09/2025"
    - title: "Monee — топовое приложение для повседневных финансов!"
      body: "Пользуюсь Monee уже какое‑то время и в полном восторге! Приложение интуитивное, аккуратное и невероятно упрощает контроль финансов. Особенно нравятся понятная структура категорий, автосинхронизация и полезная аналитика. С Monee у меня всегда под контролем доходы и расходы — без сложных таблиц и муторных расчётов. Если нужен надёжный современный финансовый инструмент — это он. Однозначная рекомендация!"
      reviewerNickname: "DG#4"
      createdDate: "03/08/2025"
    - title: "Редко так радуюсь приложениям"
      body: "Редкость — найти бесплатное приложение, которое реально что‑то делает, да ещё и без рекламы. Макет понятный и приятный, пользоваться легко. Спасибо издателю!"
      reviewerNickname: "StSch."
      createdDate: "12/02/2024"
    - title: "Просто и понятно"
      body: "Обожаю это приложение. Многое перепробовала — ни одно не зашло: то дорого, то перегружено, то лишних функций тьма. Это — красиво структурировано и понятно, при этом простое и бесплатное, без лишнего антуража. Так держать, СПАСИБО!"
      reviewerNickname: "Tammiilein"
      createdDate: "03/15/2025"
    - title: "Идеально для домашнего бюджета"
      body: "Наконец‑то приложение без лишнего, но с полным набором нужного! Детски простое управление, повторяющиеся платежи в разных ритмах, категории легко поддерживать, аналитика чётко показывает картину — и всё это бесплатно <3 Огромное спасибо! :-)"
      reviewerNickname: "Plueschappel"
      createdDate: "03/21/2025"
    - title: "Лучшее приложение!!"
      body: "Перепробовала несколько — это однозначно лучшее! Полностью бесплатно и без рекламы… Ждала подвоха… но его нет. Пользоваться легко, под себя настраивается — можно создавать собственные категории. Лучше не бывает!!"
      reviewerNickname: "Kadania"
      createdDate: "03/07/2025"
    - title: "Всё, что нужно!"
      body: "С новыми функциями ‘очистить все фильтры сразу’ и ‘привязать отдельный расход к конкретному человеку’ в приложении теперь есть всё, что нужно! Никакого лишнего, аккуратно и по делу — супер! И не забудем о очень быстром и дружелюбном саппорте! Если бы на всё были такие отличные бескорыстные приложения, жить стало бы проще. Огромное спасибо разработчику!!!"
      reviewerNickname: "Gahndalf"
      createdDate: "07/24/2024"
    - title: "Супер, спасибо — большая помощь"
      body: "Понятно; категорий достаточно, но можно добавить/редактировать, есть графический обзор для анализа и много места для заметок. Вывод: отличное приложение без лишнего, которое сразу помогает фиксировать расходы, видеть ловушки и потом категоризировать. Спасибо!"
      reviewerNickname: "Matt1210er"
      createdDate: "07/15/2024"
    - title: "Блестяще"
      body: "Блестящее приложение, если нужен простой инструмент для записи расходов и/или вы живёте вместе с кем‑то. Каждый может вносить покупки и категоризировать их. Потом можно анализировать помесячно или по годам. Впечатлена и рекомендую это полностью бесплатное и безрекламное приложение. Спасибо 🙏🏼 разработчику!"
      reviewerNickname: "Casu65"
      createdDate: "07/29/2024"
    - title: "Отличное приложение!"
      body: "Я UI‑дизайнер и искала что‑то очень минималистичное для семьи — попали в точку! Респект разработчику и за отличный внешний вид. Мы с мужем очень довольны: приложение без лишнего даёт отличный обзор финансов — и всё это бесплатно. Привет из Гамбурга в Гамбург, дорогой Stephan :)."
      reviewerNickname: "Pueppsiliiiii"
      createdDate: "07/31/2024"
    - title: "Отличное приложение и быстрый сервис"
      body: "Все функции, что нужны для домашней бухгалтерии, в приложении есть. Когда при настройке возникла проблема, разработчик помог мгновенно через обратную связь. Такого ещё не видела — 5*!"
      reviewerNickname: "Proxy365er"
      createdDate: "10/23/2024"
    - title: "Понятно и по делу"
      body: "Monee — идеальное приложение, чтобы быстро и просто держать финансы под контролем — без рекламы, подписок и лишнего балласта. Понятный интерфейс, интуитивное управление и полный контроль над доходами и расходами. Абсолютно рекомендую!"
      reviewerNickname: "DonMonk"
      createdDate: "08/11/2024"
    - title: "Делает то, что нужно!"
      body: "Наконец‑то бесплатное приложение без лишнего, с которым финансы легко держать в поле зрения! Класс! Спасибо за вашу работу! 👍🏼"
      reviewerNickname: "Famcramer"
      createdDate: "03/12/2025"
    - title: "Очень наглядно и полезно"
      body: "Скачал приложение в начале 2025‑го и очень доволен. Настройка категорий и ввод доходов/расходов понятны, а графики интересные. С удовольствием пользуюсь."
      reviewerNickname: "JayBeeBerlin"
      createdDate: "03/08/2025"
    - title: "Оправдывает обещания"
      body: "Пользуюсь Monee уже некоторое время и очень доволен. Простое и понятное, при этом есть всё, что нужно. Очень рекомендую!"
      reviewerNickname: "Schnicki_Tim"
      createdDate: "03/09/2025"
    - title: "Простой интерфейс и управление"
      body: "Долго искала подходящее финансовое приложение — это оно! Только доходы и расходы, без привязки к банку и учёта ‘всего капитала’. Каждый месяц чётко вижу, сколько потратила и заработала. Именно то, что хотела: простота без лишнего!"
      reviewerNickname: "Kathi H. ☺️"
      createdDate: "11/08/2024"
    - title: "Современно, просто, хорошо, бесплатно"
      body: "Я в восторге. Такие приложения стали редкостью, поэтому ценю особенно: делает то, что надо — не больше. Красиво выглядит, очень удобно, не собирает данные и ничего не пытается продать. Сделано человеком со знанием дела и мотивацией, а не сомнительной компанией."
      reviewerNickname: "mageful"
      createdDate: "04/26/2025"
    - title: "Понятно и с множеством опций"
      body: "Искала простой способ отслеживать ремонт и крупные покупки отдельно от повседневных трат. После нескольких неудачных попыток Monee стал первым бесплатным и понятным решением. Могу потом исправить или удалить неверно присвоенные категории — для меня это очень важно. Пользуюсь неделю и надеюсь, всё так и останется."
      reviewerNickname: "Charly221122"
      createdDate: "04/23/2025"
    - title: "Отличное приложение"
      body: "Раньше пользовалась другим — слишком перегруженным и потому непонятным. Здесь нет лишнего, всё само собой разумеется, а годовые платежи автоматически делятся по месяцам — сразу вижу, сколько откладывать. Я в восторге 🙂"
      reviewerNickname: "M.B.19935"
      createdDate: "07/15/2024"
    - title: "Очень удобное для пользователя"
      body: "Искал простой способ точно отслеживать и категоризировать расходы. Приложение полностью закрывает потребности: очень простое, быстро осваивается, без лишнего, прекрасно бесплатно и без рекламы. Безмерно рад находке и благодарен разработчику. Отдельное уважение — за три месяца не было ни одного сбоя."
      reviewerNickname: "Privatuser14"
      createdDate: "03/08/2025"

