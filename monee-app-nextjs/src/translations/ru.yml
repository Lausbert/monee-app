features:
  - title: "Быстрый и простой ввод"
    description: "Введите сумму, выберите категорию и при желании добавьте заметку — всё за секунды!"
    emoji: "✍️"
  - title: "Наглядный обзор"
    description: "Видите, куда уходят деньги, благодаря ежемесячным сводкам доходов и расходов."
    emoji: "📊"
  - title: "Совместный бюджет"
    description: "Приглашайте близких и легко ведите общие финансы — идеально для семей или соседей по дому."
    emoji: "🏠"
  - title: "Неограниченные счета"
    description: "Создавайте столько отдельных счетов, сколько нужно — для людей, целей или проектов."
    emoji: "➕"
  - title: "Неограниченные операции"
    description: "Добавляйте столько доходов и расходов, сколько хотите. Без ограничений."
    emoji: "💸"
  - title: "Повторяющиеся операции"
    description: "Автоматически учитывайте регулярные доходы или расходы."
    emoji: "🔁"
  - title: "Пользовательские категории"
    description: "Организуйте финансы по‑своему с категориями, которые создаёте сами."
    emoji: "🗂️"
  - title: "Мощные фильтры"
    description: "Находите нужное, фильтруя операции по типу, периодичности или участникам."
    emoji: "🔍"
  - title: "Валюты всего мира"
    description: "Используйте любую валюту — идеально для путешествий и международных пользователей."
    emoji: "🌍"
  - title: "Экспорт данных"
    description: "Экспортируйте свои финансовые данные в любой момент."
    emoji: "📤"
  - title: "Бесшовно на всех устройствах"
    description: "Пользуйтесь Monee на iPhone, iPad и Mac — данные синхронизируются между всеми устройствами."
    emoji: "🧩"
  - title: "Защита биометрией и кодом"
    description: "Храните данные в безопасности с Face ID, Touch ID или код‑паролем."
    emoji: "🔐"
  - title: "Гибкое начало месяца"
    description: "Установите удобный для вас день начала финансового месяца."
    emoji: "📅"
  - title: "Перенос остатка"
    description: "Легко переносите оставшийся баланс на следующий месяц."
    emoji: "🔄"
  - title: "Без регистрации"
    description: "Начинайте сразу — без регистрации и лишних шагов."
    emoji: "🚪"
  - title: "Без рекламы и трекинга"
    description: "Наслаждайтесь чистым и приватным опытом — без рекламы и слежения за данными."
    emoji: "🛡️"
  - title: "100% бесплатно"
    description: "Все функции — бесплатно: ни подписок, ни встроенных покупок."
    emoji: "🎉"

