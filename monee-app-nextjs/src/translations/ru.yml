authors:
  stephan_lerner:
    bio: "Я разрабатываю лучшее приложение для управления деньгами."
  lina:
    bio: "Студентка коммуникаций из Берлина, делится реальными цифрами и простыми бюджетными экспериментами, которые действительно подходят студенческой жизни."
  maya_and_tom:
    bio: "Пара из Гамбурга рассказывает, как они честно делят продукты, счета и поездки — с простыми правилами, которые каждый может повторить."
  jules:
    bio: "Фриланс-дизайнер из Кельна, который упрощает ведение бюджета при нерегулярном доходе с помощью практичных шаблонов, систем категорий и ежемесячных обзоров."
  elena:
    bio: "Мюнхенская мама и «CFO» семьи, которая выискивает скрытые семейные траты и проводит мягкий еженедельный 15-минутный денежный чек-ин."
  marco:
    bio: "Живущий в Лиссабоне экспат из Франкфурта, который делится многовалютными туристическими бюджетами, путеводителями по расходам по городам и лайфхаками по переносу остатка."
  nadia:
    bio: "Тренер по переговорам, который превращает стрессовые разговоры о деньгах в уважительные сценарии, чтобы вы могли уверенно снижать счета и отменять комиссии."
  rafael:
    bio: "Беспристрастный обозреватель продуктов, стресс-тестирующий банки, страховые дополнения и финтех на портативность, прозрачность и реальные планы выхода."
  ashia:
    bio: "Поведенческий коуч, создающий мягкие, без стыда подсказки и небольшие настройки по умолчанию, чтобы реальные люди доводили финансовые намерения до конца."
  bao:
    bio: "Математический минималист, который превращает денежные выборы в запоминающиеся правила, ясные пороги и простые визуализации, которыми действительно удобно пользоваться."
  zoe:
    bio: "Планировщик сценариев, ведущий через матрицы решений на основе ценностей, чтобы вы выбирали жизненные и финансовые варианты с ясностью и уверенностью."
