    bio: "Diseñador/a freelance afincado/a en Colonia que descomplica el presupuesto con ingresos irregulares mediante plantillas prácticas, sistemas de categorías y resúmenes mensuales."
  elena:
    bio: "Madre de Múnich y CFO del hogar que detecta gastos ocultos y realiza una revisión financiera semanal de 15 minutos."
  marco:
    bio: "Expat afincado en Lisboa, de Fráncfort, que comparte presupuestos de viaje en varias divisas, guías de gasto por ciudad y trucos de arrastre de saldo."
  nadia:
    bio: "Coach de negociación que convierte llamadas estresantes sobre dinero en guiones respetuosos para que puedas bajar facturas y cancelar comisiones con confianza."
  rafael:
    bio: "Analista imparcial de productos que somete a bancos, complementos de seguros y fintech a pruebas de estrés para evaluar portabilidad, transparencia y planes de salida reales."
  ashia:
    bio: "Coach de comportamiento que diseña empujones suaves, sin vergüenza, y pequeñas configuraciones predeterminadas que ayudan a personas reales a cumplir sus intenciones con el dinero."
  bao:
    bio: "Divulgador minimalista en matemáticas que destila decisiones de dinero en reglas memorizables, umbrales claros y visuales sencillos que puedes usar de verdad."
  zoe:
    bio: "Planificadora de escenarios que te guía con matrices de decisión basadas en valores para que elijas opciones de vida y dinero con claridad y confianza."
