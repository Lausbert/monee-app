    downloads: "Más de 200.000 Descargas en todo el mundo"
  reviews:
    - title: "¡¡Excelente aplicación!!"
      body: "Aparte del hecho de que un libro de cuentas domésticas es algo súper útil e importante, ¡creo que el desarrollador ha logrado un verdadero golpe maestro con Monee! Está claramente diseñada, es intuitiva y fácil de usar, todas las funciones esenciales están incluidas y, por supuesto, hay un análisis de ingresos y gastos. Ya no necesito ninguna otra aplicación... y todo es completamente gratuito y sin anuncios. ¡Respeto y muchas gracias al desarrollador!"
      reviewerNickname: "Jürgen A."
      createdDate: "02/11/2025"
    - title: "¡Brillantemente clara y hermosamente diseñada!"
      body: "Usé otra aplicación para registrar mis gastos durante seis años y cambié a esta hace unas semanas: es mucho más bonita, más ligera, más moderna y mucho más fácil de usar. Y en la actualización de hoy el desarrollador incluso cumplió mi deseo de poder usar la aplicación solo. ❤️ ¡Estoy absolutamente encantado! 🙏🏻🤩 La aplicación es fantástica y el desarrollador responde muy rápido a las preguntas. ¡Excelente!"
      reviewerNickname: "Lukulli"
      createdDate: "02/11/2025"
    - title: "Aplicación perfecta para rastrear gastos e ingresos"
      body: "Hemos estado usando la aplicación durante más de un año y estamos muy satisfechos. La aplicación es gratuita, se actualiza frecuentemente y se agregan nuevas funciones todo el tiempo. Puedes automatizar gastos o ingresos recurrentes, agregar categorías y luego filtrar todo para saber exactamente cuánto has gastado en cualquier categoría. ¡Realmente puedes ver el esfuerzo detrás de esto!"
      reviewerNickname: "User31.12."
      createdDate: "03/10/2025"
    - title: "¡Realmente buena aplicación! ¡Hombre, me gusta mucho!"
      body: "En serio: la aplicación ofrece todo lo que necesitas, está bien hecha y cualquier cosa que yo personalmente haría diferente no vale la pena restar una estrella. No cuesta nada, no hay registro, MFA u otras cosas molestas. ¡Realmente buena aplicación! ¡Hombre, me gusta mucho! ¡GRACIAS! 🙏🏻"
      reviewerNickname: "VNZNTG"
      createdDate: "08/02/2024"
    - title: "Mejor que las aplicaciones de pago"
      body: "Realmente tienes que decir que esta es una aplicación de primera clase. Y el hecho de que sea completamente gratuita y sin anuncios merece más que solo una cortés reverencia. 🙂"
      reviewerNickname: "TimeForIOTA"
      createdDate: "01/09/2025"
    - title: "Monee - ¡Aplicación financiera top para uso diario!"
      body: "He estado usando Monee por un tiempo y estoy absolutamente encantado. La aplicación es intuitiva, bien organizada y hace que sea increíblemente fácil hacer un seguimiento de mis finanzas. Me gusta especialmente el diseño claro de categorías, la sincronización automática y los análisis útiles. Gracias a Monee siempre tengo mis ingresos y gastos bajo control, sin hojas de cálculo complicadas o cálculos tediosos. Si estás buscando una aplicación financiera confiable y moderna, esta es la indicada. ¡Recomendación clara!"
      reviewerNickname: "DG#4"
      createdDate: "03/08/2025"
    - title: "Raramente he estado tan emocionado con una aplicación"
      body: "Es raro encontrar aplicaciones gratuitas que realmente hagan algo, y menos aún sin anuncios. Encuentro el diseño claro y agradable a la vista, y es fácil de usar. ¡Gracias al editor!"
      reviewerNickname: "StSch."
      createdDate: "12/02/2024"
    - title: "Clara y simple"
      body: "Me encanta esta aplicación. Probé muchas y ninguna me convenció: demasiado caras, demasiado desordenadas, demasiadas funciones. Esta está bellamente estructurada y es clara, pero simple y gratuita sin adornos innecesarios. ¡Sigue así, GRACIAS!"
      reviewerNickname: "Tammiilein"
      createdDate: "03/15/2025"
    - title: "Aplicación perfecta para el presupuesto doméstico"
      body: "¡Finalmente una aplicación que se las arregla sin muchos adornos pero que aún así entrega todo lo que necesitas! Operación fácil como para un niño, pagos recurrentes en diferentes ritmos, categorías fáciles de mantener, análisis que muestran claramente lo que está pasando, y todo gratis <3 ¡Muchas gracias! :-)"
      reviewerNickname: "Plueschappel"
      createdDate: "03/21/2025"
    - title: "¡¡La mejor aplicación!!"
      body: "He probado varias aplicaciones y esta es definitivamente la mejor. Completamente gratuita y sin anuncios... En realidad esperaba una trampa... pero no la hay. Fácil de usar y adaptar a tus propias necesidades porque puedes crear categorías personalizadas para todo. ¡No puede ser mejor!"
      reviewerNickname: "Kadania"
      createdDate: "03/07/2025"
    - title: "¡Todo lo que necesitas!"
      body: "Con las nuevas funciones 'limpiar todos los filtros de una vez' y 'asignar gastos individuales a personas específicas', ¡la aplicación ahora tiene todo lo que necesitas! Sin adornos, bonita y delgada, enfocada en lo esencial: ¡genial! ¡Sin olvidar el soporte súper rápido y muy amigable! Si solo hubiera aplicaciones tan grandiosas y desinteresadas para todo, nuestras vidas serían más fáciles. ¡Muchas gracias al desarrollador!"
      reviewerNickname: "Gahndalf"
      createdDate: "07/24/2024"
    - title: "Increíble, gracias - una gran ayuda"
      body: "Claro; suficientes categorías, pero puedes agregar más y editarlas, además de una vista gráfica para análisis y mucho espacio en el campo de comentarios para notas adicionales. Conclusión: una gran aplicación sin adornos que inmediatamente te ayuda a registrar costos, visualizar trampas de dinero y luego categorizarlos. ¡Gracias!"
      reviewerNickname: "Matt1210er"
      createdDate: "07/15/2024"
    - title: "Brillante"
      body: "Una aplicación brillante si estás buscando una herramienta simple para registrar tus gastos y/o si vives en un apartamento compartido o en pareja. Todos pueden ingresar y categorizar lo que compraron. Luego puedes analizar los costos mensual o anualmente. Estoy impresionado y puedo recomendar esta aplicación completamente gratuita y sin anuncios. ¡Gracias 🙏🏼 al desarrollador!"
      reviewerNickname: "Casu65"
      createdDate: "07/29/2024"
    - title: "¡Excelente aplicación!"
      body: "Soy diseñador de UI y estaba buscando algo muy minimalista que pudiéramos usar como familia: ¡bam! Diana. Felicitaciones al desarrollador por hacerla verse tan bien también. Mi esposo y yo estamos muy contentos: la aplicación se las arregla sin complicaciones y nos da una buena visión general de nuestras finanzas, y todo eso gratis. Saludos de Hamburgo a Hamburgo, querido Stephan :)."
      reviewerNickname: "Pueppsiliiiii"
      createdDate: "07/31/2024"
    - title: "Gran aplicación con servicio rápido"
      body: "La aplicación en sí ofrece todas las funciones que necesito para un libro de cuentas domésticas. Cuando tuve un problema durante la configuración, el desarrollador me ayudó inmediatamente a través de la función de comentarios. ¡Nunca había experimentado algo así: 5 estrellas!"
      reviewerNickname: "Proxy365er"
      createdDate: "10/23/2024"
    - title: "Clara y directa"
      body: "Monee es la aplicación perfecta para hacer un seguimiento de tus finanzas de manera rápida y fácil, sin anuncios, suscripciones o lastre innecesario. Presentación clara, operación intuitiva y control total sobre ingresos y gastos. ¡Absolutamente recomendada!"
      reviewerNickname: "DonMonk"
      createdDate: "08/11/2024"
    - title: "¡Hace lo que se supone que debe hacer!"
      body: "¡Finalmente una aplicación gratuita sin adornos que te permite vigilar tus finanzas fácilmente! ¡Genial! ¡Gracias por tu trabajo! 👍🏼"
      reviewerNickname: "Famcramer"
      createdDate: "03/12/2025"
    - title: "Muy clara y útil"
      body: "Descargué la aplicación a principios de 2025 y estoy muy satisfecho con ella. Personalizar categorías e ingresar ingresos y gastos es claro, y los gráficos generados son interesantes. Me encanta usar la aplicación."
      reviewerNickname: "JayBeeBerlin"
      createdDate: "03/08/2025"
    - title: "Cumple lo que promete"
      body: "He estado usando Monee durante un tiempo y estoy muy satisfecho. Es simple y claro pero tiene todo lo que necesitas. ¡Muy recomendado!"
      reviewerNickname: "Schnicki_Tim"
      createdDate: "03/09/2025"
    - title: "Diseño y operación simples"
      body: "¡Busqué una aplicación financiera adecuada durante mucho tiempo y esta es! Solo gastos e ingresos, sin vinculación de cuentas o seguimiento de patrimonio total. Cada mes puedo ver exactamente cuánto gasté y gané. Exactamente lo que quería: ¡una aplicación simple sin adornos!"
      reviewerNickname: "Kathi H. ☺️"
      createdDate: "11/08/2024"
    - title: "Moderna, simple, buena, gratuita"
      body: "Estoy encantado. Las aplicaciones como esta se han vuelto raras, lo que la hace aún más valiosa: hace lo que debe hacer, nada más. Se ve bien, muy usable, no recopila datos y no trata de vender nada extra. Creada por alguien con conocimiento y motivación, no una empresa dudosa del extranjero."
      reviewerNickname: "mageful"
      createdDate: "04/26/2025"
    - title: "Clara con muchas opciones"
      body: "Estaba buscando un sistema simple para rastrear nuestro trabajo de renovación y nuevas compras de un vistazo sin gastos del día a día. Después de varios intentos fallidos, Monee fue el primer programa gratuito y claro. Puedo reasignar o eliminar elementos mal categorizados después, lo cual era muy importante para mí. Solo la he estado usando durante una semana y espero que todo se mantenga tal como está."
      reviewerNickname: "Charly221122"
      createdDate: "04/23/2025"
    - title: "Gran aplicación"
      body: "Anteriormente usé otra aplicación que estaba demasiado sobrecargada y por tanto confusa. Esta aplicación se las arregla sin muchos adornos, es autoexplicativa y los pagos anuales se prorratean automáticamente, así que inmediatamente sé cuánto necesito apartar cada mes. Estoy entusiasmado 🙂"
      reviewerNickname: "M.B.19935"
      createdDate: "07/15/2024"
    - title: "Muy fácil de usar"
      body: "Estaba buscando una manera simple de monitorear y categorizar mis gastos con precisión. Esta aplicación satisface mis necesidades, es muy fácil de usar, rápida de entender, libre de adornos innecesarios y maravillosamente sin anuncios y sin costo. Estoy extremadamente feliz de haber encontrado esta aplicación y agradezco al desarrollador. Respeto por el hecho de que en tres meses de uso no ha habido ni una sola interrupción."
      reviewerNickname: "Privatuser14"
      createdDate: "03/08/2025"
  features:
    - title: "Registro Rápido y Fácil"
      description: "Ingresa el monto, elige una categoría y opcionalmente agrega una nota: ¡listo en segundos!"
      emoji: "✍️"
    - title: "Vista General Perspicaz"
      description: "Ve exactamente a dónde va tu dinero con resúmenes mensuales de tus ingresos y gastos."
      emoji: "📊"
    - title: "Hogar Compartido"
      description: "Invita a otros y gestiona las finanzas compartidas fácilmente: perfecto para familias o compañeros de piso."
      emoji: "🏠"
    - title: "Cuentas Ilimitadas"
      description: "Crea tantas cuentas separadas como necesites: para diferentes personas, objetivos o proyectos."
      emoji: "➕"
    - title: "Transacciones Ilimitadas"
      description: "Agrega tantas entradas de ingresos y gastos como quieras. Sin límites."
      emoji: "💸"
    - title: "Transacciones Recurrentes"
      description: "Rastrea automáticamente ingresos o gastos repetitivos con facilidad."
      emoji: "🔁"
    - title: "Categorías Personalizadas"
      description: "Organiza tus finanzas a tu manera con categorías que tú defines."
      emoji: "🗂️"
    - title: "Filtros Potentes"
      description: "Encuentra exactamente lo que buscas filtrando transacciones por tipo, frecuencia o personas involucradas."
      emoji: "🔍"
    - title: "Monedas de Todo el Mundo"
      description: "Usa cualquier moneda que quieras: perfecto para viajeros o usuarios internacionales."
      emoji: "🌍"
    - title: "Exportar Datos"
      description: "Exporta tus datos financieros cuando los necesites."
      emoji: "📤"
    - title: "Sincronización entre Dispositivos"
      description: "Usa Monee en tu iPhone, iPad y Mac, con tus datos sincronizados sin problemas en todos los dispositivos."
      emoji: "🧩"
    - title: "Protección Biométrica y por Código"
      description: "Mantén tus datos seguros con Face ID, Touch ID o un código de acceso."
      emoji: "🔐"
    - title: "Inicio de Mes Flexible"
      description: "Establece el comienzo de tu mes financiero en cualquier día que prefieras."
      emoji: "📅"
    - title: "Transferencia de Saldo"
      description: "Transfiere tu saldo restante al próximo mes con facilidad."
      emoji: "🔄"
    - title: "Sin Registro"
      description: "Comienza inmediatamente: sin registro, sin complicaciones."
      emoji: "🚪"
    - title: "Sin Anuncios, Sin Rastreo"
      description: "Disfruta de una experiencia limpia y privada sin anuncios y sin rastreo de datos."
      emoji: "🛡️"
    - title: "100% Gratuita"
      description: "Todas las características incluidas sin costo: sin suscripciones, sin compras dentro de la aplicación."
      emoji: "🎉"

